# Xiao Huang for Kylin ARM64 —— Apache 主配置
# 由安装器生成。模块用绝对路径，兼容 Debian/Ubuntu(apache2) 与 RHEL/openEuler(httpd) 布局。

ServerRoot "@APACHE_HOME@"
PidFile @RUN_DIR@/httpd.pid
DefaultRuntimeDir @RUN_DIR@
ServerName localhost:@HTTP_PORT@
# 监听端口由 conf/vhosts/Listen.conf 提供（与 Windows 版布局一致）

# 运行身份（root 启动后降权）
User @RUN_USER@
Group @RUN_GROUP@

ServerAdmin admin@localhost
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
UseCanonicalName Off
HostnameLookups Off
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ---------------------------------------------------------------------------
# 模块（路径由安装器探测）
# ---------------------------------------------------------------------------
LoadModule @MPM_MODULE@_module      @MODULE_DIR@/mod_@MPM_MODULE@.so
LoadModule authn_core_module     @MODULE_DIR@/mod_authn_core.so
LoadModule authz_core_module     @MODULE_DIR@/mod_authz_core.so
LoadModule authz_host_module     @MODULE_DIR@/mod_authz_host.so
LoadModule access_compat_module  @MODULE_DIR@/mod_access_compat.so
LoadModule dir_module            @MODULE_DIR@/mod_dir.so
LoadModule mime_module           @MODULE_DIR@/mod_mime.so
LoadModule log_config_module     @MODULE_DIR@/mod_log_config.so
LoadModule unixd_module          @MODULE_DIR@/mod_unixd.so
LoadModule autoindex_module      @MODULE_DIR@/mod_autoindex.so
LoadModule rewrite_module        @MODULE_DIR@/mod_rewrite.so
LoadModule headers_module        @MODULE_DIR@/mod_headers.so
LoadModule deflate_module        @MODULE_DIR@/mod_deflate.so
LoadModule filter_module         @MODULE_DIR@/mod_filter.so
LoadModule proxy_module          @MODULE_DIR@/mod_proxy.so
LoadModule proxy_fcgi_module     @MODULE_DIR@/mod_proxy_fcgi.so
LoadModule ssl_module            @MODULE_DIR@/mod_ssl.so
LoadModule socache_shmcb_module  @MODULE_DIR@/mod_socache_shmcb.so

TypesConfig "@MIME_TYPES@"
<IfModule !mime_module>
    AddType text/html .html
</IfModule>

ErrorLog "@LOG_DIR@/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "@LOG_DIR@/apache-access.log" combined

DocumentRoot "@WWW_ROOT@"
<Directory />
    AllowOverride none
    Require all denied
</Directory>

<Directory "@WWW_ROOT@">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html index.htm
</Directory>

<Files ".ht*">
    Require all denied
</Files>

# PHP：通过 mod_proxy_fcgi 转发到 php-fpm（127.0.0.1:9000）
<IfModule proxy_fcgi_module>
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:@PHP_FPM_PORT@"
    </FilesMatch>
</IfModule>

# 站点：由 xiaohuang site add 生成，Listen 由 vhosts/Listen.conf 提供
IncludeOptional "@APACHE_HOME@/conf/vhosts/*.conf"

# 错误页（Apache 不识别非标准状态码 509，故只声明标准码；
# 非标准码由 Nginx 的 error_page 处理）
ErrorDocument 400 /error/400.html
ErrorDocument 403 /error/403.html
ErrorDocument 404 /error/404.html
ErrorDocument 500 /error/500.html
ErrorDocument 501 /error/501.html
ErrorDocument 502 /error/502.html
ErrorDocument 503 /error/503.html
ErrorDocument 504 /error/504.html
ErrorDocument 505 /error/505.html
ErrorDocument 506 /error/506.html
ErrorDocument 507 /error/507.html
ErrorDocument 510 /error/510.html
