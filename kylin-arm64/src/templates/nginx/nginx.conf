
# Xiao Huang for Kylin ARM64 —— Nginx 主配置
# 由安装器生成，路径与端口来自 xiaohuang.ini
# 与 Windows 版 app/Extensions/Nginx1.15.11/conf/nginx.conf 结构一致

user  @RUN_USER@;
worker_processes  auto;

error_log  @LOG_DIR@/nginx-error.log  warn;
pid        @NGINX_HOME@/logs/nginx.pid;

events {
    worker_connections  10240;
    use epoll;
    multi_accept on;
}

http {
    include       @NGINX_HOME@/conf/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 按日期切分访问日志（与 Windows 版一致：map $time_iso8601）
    map $time_iso8601 $logdate {
        '~^(?<ymd>\d{4}-\d{2}-\d{2})' $ymd;
        default                       'date-not-found';
    }

    access_log  @LOG_DIR@/nginx-access-$logdate.log  main;

    sendfile        on;
    sendfile_max_chunk 512k;
    tcp_nopush      on;
    keepalive_timeout  65;
    keepalive_requests 100;
    reset_timedout_connection on;
    send_timeout 60;

    client_max_body_size 50m;
    client_body_buffer_size 60k;
    client_body_timeout 60;
    client_header_buffer_size 64k;
    client_header_timeout 60;
    large_client_header_buffers 4 64k;
    server_names_hash_bucket_size 256;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # PHP FastCGI（与 Windows 版 fastcgi_pass 127.0.0.1:9000 对齐）
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 60s;
    fastcgi_read_timeout 300s;

    # 站点根目录与错误页
    root  @WWW_ROOT@;
    index index.php index.html index.htm;

    error_page 400 /error/400.html;
    error_page 403 /error/403.html;
    error_page 404 /error/404.html;
    error_page 500 /error/500.html;
    error_page 501 /error/501.html;
    error_page 502 /error/502.html;
    error_page 503 /error/503.html;
    error_page 504 /error/504.html;
    error_page 505 /error/505.html;
    error_page 506 /error/506.html;
    error_page 507 /error/507.html;
    error_page 509 /error/509.html;
    error_page 510 /error/510.html;

    # 默认站点（localhost），其余站点由 xiaohuang site add 生成
    include @NGINX_HOME@/conf/vhosts/*.conf;
}
