; Xiao Huang for Kylin ARM64 —— PHP-FPM 主配置 + www 池
; 监听 127.0.0.1:@PHP_FPM_PORT@（与 Windows 版 fastcgi_pass 127.0.0.1:9000 对齐）

[global]
pid = @RUN_DIR@/php-fpm.pid
error_log = @LOG_DIR@/php-fpm.log
daemonize = yes
; 允许 root 启动（服务单元以 root 运行，worker 降权到 www-data）
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

[www]
user = @RUN_USER@
group = @RUN_GROUP@
listen = 127.0.0.1:@PHP_FPM_PORT@
listen.backlog = 511
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status

request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = @LOG_DIR@/php-fpm-slow.log

chdir = @WWW_ROOT@
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = @LOG_DIR@/php-fpm-www-error.log
php_admin_flag[log_errors] = on
php_value[session.save_path] = @TMP_DIR@
php_value[upload_max_filesize] = 100M
php_value[post_max_size] = 100M
php_value[memory_limit] = 256M
php_value[max_execution_time] = 300
php_value[date.timezone] = Asia/Shanghai

access.log = @LOG_DIR@/php-fpm-access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
