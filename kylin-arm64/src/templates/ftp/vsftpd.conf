# Xiao Huang FTP 服务（vsftpd）—— 由安装器按安装路径渲染
# 账号一律是系统用户：home 指向站点目录，shell=/usr/sbin/nologin
listen=YES
listen_ipv6=NO
listen_port=@FTP_PORT@
background=NO

# 只允许白名单里的账号登录（xiaohuang ftp user add 维护）
local_enable=YES
write_enable=YES
userlist_enable=YES
userlist_deny=NO
userlist_file=@FTP_HOME@/etc/userlist

# 每个账号锁在自己的站点目录里
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=@FTP_HOME@/empty

anonymous_enable=NO
local_umask=022
dirmessage_enable=YES
use_localtime=YES
connect_from_port_20=YES
hide_ids=YES
session_support=NO
tcp_wrappers=NO

# 被动模式端口范围（防火墙放行这一段）
pasv_enable=YES
pasv_min_port=@PASV_MIN@
pasv_max_port=@PASV_MAX@
pasv_promiscuous=NO

# 认证走独立 PAM 配置，不碰系统 vsftpd 包
pam_service_name=xiaohuang-vsftpd

# 日志
xferlog_enable=YES
xferlog_std_format=NO
xferlog_file=@FTP_HOME@/logs/xferlog
vsftpd_log_file=@FTP_HOME@/logs/vsftpd.log
dual_log_enable=YES
log_ftp_protocol=YES

# 明文传输（需要 FTPS 时把 ssl_enable 改 YES 并给证书）
ssl_enable=NO

# 单连接限速（KB/s，0 = 不限）
local_max_rate=0
max_clients=50
max_per_ip=10
idle_session_timeout=300
data_connection_timeout=120
